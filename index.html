<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — Minimal To‑Do</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="app-title">

      <!-- Header -->
      <header class="card__header">
        <h1 id="app-title" class="card__title">My Tasks</h1>
        <p class="card__meta" id="task-count" aria-live="polite">0 tasks</p>
      </header>

      <!-- Input row -->
      <form class="input-row" id="task-form" novalidate>
        <div class="input-wrapper">
          <input
            type="text"
            id="task-input"
            class="input"
            placeholder="Add a new task…"
            autocomplete="off"
            aria-label="New task description"
            aria-describedby="input-error"
            maxlength="200"
          />
        </div>
        <button type="submit" class="btn-add" id="add-btn" aria-label="Add task">
          <span class="btn-add__label">Add</span>
          <span class="btn-add__ripple" aria-hidden="true"></span>
        </button>
      </form>
      <p class="input-error" id="input-error" role="alert" aria-live="assertive"></p>

      <!-- Task list -->
      <ul class="task-list" id="task-list" aria-label="Task list"></ul>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <svg class="empty-state__icon" width="40" height="40" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="3"></rect>
          <path d="M8 8h8M8 12h8M8 16h5"></path>
        </svg>
        <p class="empty-state__text">No tasks yet — add one above</p>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
